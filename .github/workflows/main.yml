name: CD · apptrain

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      version:
        description: "Version, for example 1.0.0"
        required: true
        type: string

  workflow_call:
    inputs:
      version:
        description: "Version, for example 1.0.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

run-name: "apptrain · ${{ github.ref_name }}"

env:
  NAMESPACE: apptrain
  BACKEND_IMAGE: ghcr.io/jamaltaffal/apptrain-backend:1.0.0
  FRONTEND_IMAGE: ghcr.io/jamaltaffal/apptrain-frontend:1.0.0

jobs:
  deploy:
    name: apptrain → k3s
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            IMAGE_TAG="${GITHUB_REF_NAME#v}"      # v1.2.3 -> 1.2.3
          else
            IMAGE_TAG="${INPUT_VERSION#v}"
          fi

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Using image tag: ${IMAGE_TAG}"

      # Cluster reachability is checked BEFORE building and pushing, so an
      # unreachable cluster fails the run instead of leaving an image that
      # was published but never deployed.
      - name: Configure kubeconfig
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Verify Kubernetes prerequisites
        shell: bash
        run: |
          set -euo pipefail

          kubectl get namespace "${NAMESPACE}"
          kubectl get secret ghcr-secret -n "${NAMESPACE}"
          kubectl get secret postgres-credentials -n "${NAMESPACE}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Write the new tag into the manifests, so the Deployments are created or
      # updated with the right image in a single apply (no flap to an old tag).
      - name: Set image tags in manifests
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail

          sed -i "s#image: ${BACKEND_IMAGE}:.*#image: ${BACKEND_IMAGE}:${IMAGE_TAG}#" \
            infra/backend/deployment.yaml
          sed -i "s#image: ${FRONTEND_IMAGE}:.*#image: ${FRONTEND_IMAGE}:${IMAGE_TAG}#" \
            infra/frontend/deployment.yaml

          grep -n "image:" infra/backend/deployment.yaml infra/frontend/deployment.yaml

      # secret.yaml is intentionally NOT applied: it holds a placeholder that
      # would overwrite the real database password.
      - name: Apply database
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply -f infra/namespace.yaml
          kubectl apply -f infra/database/configmap.yaml
          kubectl apply -f infra/database/pvc.yaml
          kubectl apply -f infra/database/service.yaml
          kubectl apply -f infra/database/deployment.yaml

          kubectl -n "${NAMESPACE}" rollout status deployment/postgres --timeout=5m

      - name: Deploy backend
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply -f infra/backend/configmap.yaml
          kubectl apply -f infra/backend/service.yaml
          kubectl apply -f infra/backend/deployment.yaml

          # ConfigMap changes don't restart pods by themselves
          kubectl -n "${NAMESPACE}" rollout restart deployment/backend || true
          kubectl -n "${NAMESPACE}" rollout status deployment/backend --timeout=5m

      - name: Deploy frontend
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply -f infra/frontend/configmap.yaml
          kubectl apply -f infra/frontend/service.yaml
          kubectl apply -f infra/frontend/deployment.yaml
          kubectl apply -f infra/ingress.yaml

          kubectl -n "${NAMESPACE}" rollout restart deployment/frontend || true
          kubectl -n "${NAMESPACE}" rollout status deployment/frontend --timeout=5m

      - name: Show deployed resources
        if: always()
        shell: bash
        run: |
          kubectl get deployments -n "${NAMESPACE}" -o wide
          kubectl get pods -n "${NAMESPACE}" -o wide
          kubectl get services -n "${NAMESPACE}" -o wide
          kubectl get endpoints -n "${NAMESPACE}"
          kubectl get ingress -n "${NAMESPACE}"

      - name: Show diagnostics after failure
        if: failure()
        shell: bash
        run: |
          for app in postgres backend frontend; do
            echo "===== ${app} ====="
            kubectl describe deployment "${app}" -n "${NAMESPACE}" || true

            kubectl get pods -n "${NAMESPACE}" -l app="${app}" -o name \
              | xargs -r -I{} kubectl describe {} -n "${NAMESPACE}" || true

            kubectl logs -n "${NAMESPACE}" -l app="${app}" \
              --all-containers=true --tail=200 || true

            kubectl logs -n "${NAMESPACE}" -l app="${app}" \
              --all-containers=true --previous --tail=200 || true
          done
