name: CD · apptrain
 
on:
  push:
    tags:
      - "v*.*.*"
 
  workflow_dispatch:
    inputs:
      version:
        description: "Version, for example 1.0.0"
        required: true
        type: string
 
  workflow_call:
    inputs:
      version:
        description: "Version, for example 1.0.0"
        required: true
        type: string
 
permissions:
  contents: read
  packages: write
 
run-name: "apptrain · ${{ inputs.version || github.ref_name }}"
 
concurrency:
  group: apptrain-deployment
  cancel-in-progress: false
 
env:
  NAMESPACE: apptrain
  BACKEND_IMAGE: ghcr.io/jamaltaffal/apptrain-backend
  FRONTEND_IMAGE: ghcr.io/jamaltaffal/apptrain-frontend
 
jobs:
  deploy:
    name: apptrain → k3s
    runs-on: ubuntu-latest
 
    steps:
 
      # ==========================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================
 
      - name: Checkout repository
        uses: actions/checkout@v4
 
      # ==========================================
      # 2. COMPUTE IMAGE TAG
      # ==========================================
 
      - name: Compute image tag
        id: vars
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
 
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            IMAGE_TAG="${GITHUB_REF_NAME#v}"
          else
            IMAGE_TAG="${INPUT_VERSION#v}"
          fi
 
          if [[ ! "${IMAGE_TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: Invalid version: ${IMAGE_TAG}"
            exit 1
          fi
 
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Using image tag: ${IMAGE_TAG}"
 
      # ==========================================
      # 3. CONFIGURE KUBERNETES
      # ==========================================
 
      - name: Configure kubeconfig
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
 
      # ==========================================
      # 4. VERIFY KUBERNETES
      # ==========================================
 
      - name: Verify Kubernetes connection
        id: verify_cluster
        shell: bash
        run: |
          set -euo pipefail
 
          echo "===== VERIFY CLUSTER ====="
          timeout 20s kubectl --request-timeout=10s \
            get namespace "${NAMESPACE}"
 
          echo "===== EXISTING DEPLOYMENTS ====="
          kubectl get deployments -n "${NAMESPACE}"
 
          echo "===== VERIFY REQUIRED DEPLOYMENTS ====="
          kubectl get deployment/postgres -n "${NAMESPACE}"
          kubectl get deployment/backend -n "${NAMESPACE}"
          kubectl get deployment/frontend -n "${NAMESPACE}"
 
          echo "===== VERIFY CONTAINER NAMES ====="
 
          BACKEND_CONTAINERS="$(kubectl get deployment/backend \
            -n "${NAMESPACE}" \
            -o jsonpath='{.spec.template.spec.containers[*].name}')"
 
          FRONTEND_CONTAINERS="$(kubectl get deployment/frontend \
            -n "${NAMESPACE}" \
            -o jsonpath='{.spec.template.spec.containers[*].name}')"
 
          echo "Backend containers: ${BACKEND_CONTAINERS}"
          echo "Frontend containers: ${FRONTEND_CONTAINERS}"
 
          echo "${BACKEND_CONTAINERS}" | tr ' ' '\n' | grep -Fxq backend
          echo "${FRONTEND_CONTAINERS}" | tr ' ' '\n' | grep -Fxq frontend
 
          echo "===== VERIFY SECRETS ====="
 
          kubectl get secret ghcr-secret \
            -n "${NAMESPACE}"
 
          kubectl get secret postgres-credentials \
            -n "${NAMESPACE}"
 
          echo "Kubernetes prerequisites verified"
 
      # ==========================================
      # 5. SETUP NODE.JS
      # ==========================================
 
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      # ==========================================
      # 6. DEBUG FRONTEND BUILD
      # ==========================================
 
      - name: Debug frontend build
        working-directory: ./frontend
        shell: bash
        env:
          REACT_APP_API_URL: /api
        run: |
          set -euo pipefail
 
          echo "===== NODE VERSION ====="
          node --version
 
          echo "===== NPM VERSION ====="
          npm --version
 
          echo "===== INSTALL DEPENDENCIES ====="
          npm install --no-fund
 
          echo "===== BUILD FRONTEND ====="
          npm run build
 
          echo "===== BUILD OUTPUT ====="
          ls -lah build/
 
          echo "Frontend build successful"
 
      # ==========================================
      # 7. SETUP DOCKER BUILDX
      # ==========================================
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      # ==========================================
      # 8. LOGIN TO GHCR
      # ==========================================
 
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      # ==========================================
      # 9. BUILD AND PUSH BACKEND
      # ==========================================
 
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
 
      # ==========================================
      # 10. BUILD AND PUSH FRONTEND
      # ==========================================
 
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            REACT_APP_API_URL=/api
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
 
      # ==========================================
      # 11. DEPLOY BACKEND - SET IMAGE
      # ==========================================
 
      - name: Deploy backend
        id: deploy_backend
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        run: |
          set -euo pipefail
 
          echo "===== UPDATE BACKEND IMAGE ====="
 
          kubectl -n "${NAMESPACE}" set image \
            deployment/backend \
            "backend=${BACKEND_IMAGE}:${IMAGE_TAG}"
 
          echo "===== WAIT FOR BACKEND ROLLOUT ====="
 
          kubectl -n "${NAMESPACE}" rollout status \
            deployment/backend --timeout=5m
 
          echo "===== BACKEND IMAGE ====="
 
          kubectl -n "${NAMESPACE}" get deployment/backend \
            -o jsonpath='{.spec.template.spec.containers[*].image}'
 
          echo
          echo "Backend deployment successful"
 
      # ==========================================
      # 12. DEPLOY FRONTEND - SET IMAGE
      # ==========================================
 
      - name: Deploy frontend
        id: deploy_frontend
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        run: |
          set -euo pipefail
 
          echo "===== UPDATE FRONTEND IMAGE ====="
 
          kubectl -n "${NAMESPACE}" set image \
            deployment/frontend \
            "frontend=${FRONTEND_IMAGE}:${IMAGE_TAG}"
 
          echo "===== WAIT FOR FRONTEND ROLLOUT ====="
 
          kubectl -n "${NAMESPACE}" rollout status \
            deployment/frontend --timeout=5m
 
          echo "===== FRONTEND IMAGE ====="
 
          kubectl -n "${NAMESPACE}" get deployment/frontend \
            -o jsonpath='{.spec.template.spec.containers[*].image}'
 
          echo
          echo "Frontend deployment successful"
 
      # ==========================================
      # 13. VERIFY DEPLOYMENTS
      # ==========================================
 
      - name: Show deployed resources
        shell: bash
        run: |
          set -euo pipefail
 
          echo "===== DEPLOYMENTS ====="
          kubectl get deployments \
            -n "${NAMESPACE}" -o wide
 
          echo "===== PODS ====="
          kubectl get pods \
            -n "${NAMESPACE}" -o wide
 
          echo "===== SERVICES ====="
          kubectl get services \
            -n "${NAMESPACE}" -o wide
 
          echo "===== INGRESS ====="
          kubectl get ingress \
            -n "${NAMESPACE}"
 
          echo "===== PVC ====="
          kubectl get pvc \
            -n "${NAMESPACE}"
 
          echo "===== IMAGE VERSIONS ====="
 
          kubectl get deployment/backend \
            deployment/frontend \
            -n "${NAMESPACE}" \
            -o jsonpath='{range .items[*]}{.metadata.name}{" -> "}{.spec.template.spec.containers[*].image}{"\n"}{end}'
 
          echo "Deployment completed successfully"
 
      # ==========================================
      # 14. DIAGNOSTICS ON DEPLOYMENT FAILURE
      # ==========================================
 
      - name: Show diagnostics after failure
        if: |
          failure() &&
          steps.verify_cluster.outcome == 'success' &&
          (steps.deploy_backend.outcome != 'skipped' ||
           steps.deploy_frontend.outcome != 'skipped')
        shell: bash
        run: |
          set +e
 
          echo "===== DEPLOYMENTS ====="
 
          timeout 15s kubectl --request-timeout=8s \
            get deployments -n "${NAMESPACE}"
 
          echo "===== PODS ====="
 
          timeout 15s kubectl --request-timeout=8s \
            get pods -n "${NAMESPACE}" -o wide
 
          for app in backend frontend; do
 
            echo "===== ${app} DEPLOYMENT ====="
 
            timeout 15s kubectl --request-timeout=8s \
              describe deployment "${app}" \
              -n "${NAMESPACE}"
 
            echo "===== ${app} LOGS ====="
 
            timeout 20s kubectl --request-timeout=8s \
              logs -n "${NAMESPACE}" \
              deployment/"${app}" \
              --all-containers=true \
              --tail=200
 
          done
 
          echo "===== RECENT EVENTS ====="
 
          timeout 15s kubectl --request-timeout=8s \
            get events -n "${NAMESPACE}" \
            --sort-by=.lastTimestamp
