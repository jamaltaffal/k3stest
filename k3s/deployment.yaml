apiVersion: apps/v1
kind: Deployment
metadata:
  name: apptrain
  namespace: apptrain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apptrain
  template:
    metadata:
      labels:
        app: apptrain
    spec:
      automountServiceAccountToken: false
      containers:
        - name: apptrain
          image: apptrain:1.0.0                # replace if using a registry
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: apptrain-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: POSTGRES_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD }
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: POSTGRES_DB }
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
